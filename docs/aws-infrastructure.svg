<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img">
<title>AWS infrastructure</title>
<desc>Users reach an Application Load Balancer in public subnets through Route 53 and the internet gateway. The ALB sends traffic to Fargate tasks in private subnets, which have no route to the internet. The tasks reach ECR, Secrets Manager, CloudWatch and S3 only through VPC endpoints.</desc>
