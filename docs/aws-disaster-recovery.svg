<text x="720" y="92" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c2c2a" text-anchor="middle">CloudWatch alarm</text>
<text x="720" y="107" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5f5e5a" text-anchor="middle">primary is unhealthy</text>
