<text x="190" y="92" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c2c2a" text-anchor="middle">Route 53</text>
<text x="190" y="107" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5f5e5a" text-anchor="middle">alias to the live ALB</text>
<rect x="512" y="20" width="56" height="56" rx="6" fill="#8C4FFF"/>
<text x="540" y="54" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">R53</text>
