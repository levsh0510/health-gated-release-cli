<text x="540" y="107" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5f5e5a" text-anchor="middle">Route 53, checks /health</text>
<rect x="692" y="20" width="56" height="56" rx="6" fill="#E7157B"/>
