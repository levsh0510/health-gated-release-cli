<rect x="40" y="170" width="420" height="250" rx="8" fill="#F5F9EC" stroke="#7AA116" stroke-width="2"/>
<text x="54" y="190" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#3B6D11" text-anchor="start">Region 1: primary, running</text>
<rect x="540" y="170" width="420" height="250" rx="8" fill="#FAFAF8" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="554" y="190" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#5f5e5a" text-anchor="start">Region 2: recovery, empty until needed</text>
