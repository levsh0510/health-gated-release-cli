<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img">
<title>High availability and disaster recovery</title>
<desc>Region 1 runs the stack. Region 2 is empty until needed, with only ECR images and Secrets Manager secrets replicated in advance. Terraform creates the stack in either region from the same code. A Route 53 health check raises a CloudWatch alarm and an SNS alert. In a disaster, Terraform builds the stack in region 2 and points the Route 53 alias to its load balancer.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#5f5e5a"/></marker></defs>
