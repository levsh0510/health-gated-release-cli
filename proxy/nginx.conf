# The only public entry point. Docker maps localhost:8080 -> this container's port 80.

upstream app_backend {
    # One line, written by bootstrap.sh / deploy.py, e.g.:  server mockapp-v1-0-0:5000;
    # Cutover = rewrite that file, then `nginx -s reload` (old workers finish their requests).
    include /etc/nginx/upstream/active.conf;
    keepalive 16;
}

server {
    listen 80;

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
}
